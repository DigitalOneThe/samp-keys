name: C/C++ CI Windows x86 DLL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC x86 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        vsversion: 2022
        
    - name: Configure for x86 DLL
      run: |
        # Для CMake - указываем создание DLL
        cmake -B build -S . -A Win32 -DBUILD_SHARED_LIBS=ON
        # Или с конкретными настройками
        # cmake -B build -S . -A Win32 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
        
    - name: Build x86 DLL
      run: |
        cmake --build build --config Release
        # Проверяем что создались DLL файлы
        dir build\Release\*.dll
        
    - name: Run DLL tests
      run: |
        # Если есть тесты для DLL
        ctest --test-dir build --output-on-failure
        # Или запускаем тестовое приложение
        # .\build\Release\test_app.exe
        
    - name: Verify DLL architecture
      run: |
        # Проверяем архитектуру DLL файлов
        dumpbin /headers build\Release\*.dll | findstr "machine"
        # Должны увидеть "machine (x86)" для всех DLL
