name: Build samp-keys DLL x86

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
        
    - name: Show project structure
      run: |
        echo "=== Project Structure ==="
        dir
        echo "=== Sync folder ==="
        dir Sync
        echo "=== Sync/rakclient folder ==="
        dir Sync/rakclient
        
    - name: Configure CMake for x86
      run: |
        cmake -B build -A Win32 -DBUILD_SHARED_LIBS=ON
        
    - name: Build project
      run: |
        cmake --build build --config Release
        
    - name: List built files
      run: |
        echo "=== Built files ==="
        if exist "build\bin\Release" (
            dir build\bin\Release
        )
        if exist "build\lib\Release" (
            dir build\lib\Release
        )
        
    - name: Verify DLL architecture
      run: |
        if exist "build\bin\Release\*.dll" (
          echo "=== Checking DLL architecture ==="
          for /r %%i in (build\bin\Release\*.dll) do (
            echo File: %%i
            dumpbin /headers "%%i" | findstr "machine"
          )
        ) else (
          echo "No DLL files found in bin/Release directory"
          echo "=== Checking all build directories ==="
          dir build /s *.dll
        )
