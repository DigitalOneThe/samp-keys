name: Build samp-keys DLL x86

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
        
    - name: Configure CMake for x86
      run: |
        cmake -B build -A Win32 -DBUILD_SHARED_LIBS=ON
        
    - name: Build project
      run: |
        cmake --build build --config Release
        
    - name: Check build results
      shell: cmd
      run: |
        echo "=== Checking all created files ==="
        dir build /s
        
    - name: Verify DLL architecture
      shell: cmd
      run: |
        if exist "build\*.dll" (
          echo "=== Checking DLL architecture ==="
          for %%i in (build\*.dll) do (
            echo File: %%i
            dumpbin /headers "%%i" | findstr "machine"
          )
        )
        if exist "build\bin\*.dll" (
          echo "=== Checking DLL architecture in bin ==="
          for %%i in (build\bin\*.dll) do (
            echo File: %%i
            dumpbin /headers "%%i" | findstr "machine"
          )
        )
        if exist "build\Release\*.dll" (
          echo "=== Checking DLL architecture in Release ==="
          for %%i in (build\Release\*.dll) do (
            echo File: %%i
            dumpbin /headers "%%i" | findstr "machine"
          )
        )
