name: Build samp-keys DLL x86

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Create CMakeLists.txt
      run: |
        # Создаем CMakeLists.txt если его нет
        if not exist "CMakeLists.txt" (
          echo Creating CMakeLists.txt...
          echo @^
      
    - name: Show project structure
      run: |
        echo "=== Project Structure ==="
        dir /s
        
    - name: Configure CMake for x86
      run: |
        cmake -B build -A Win32 -DBUILD_SHARED_LIBS=ON
        
    - name: Build project
      run: |
        cmake --build build --config Release
        
    - name: List built files
      run: |
        echo "=== Built files ==="
        dir build\bin\Release /s
        dir build\lib\Release /s
        
    - name: Verify DLL architecture
      run: |
        if exist "build\bin\Release\*.dll" (
          echo "=== Checking DLL architecture ==="
          for %%i in (build\bin\Release\*.dll) do (
            echo File: %%i
            dumpbin /headers "%%i" | findstr "machine"
          )
        ) else (
          echo "No DLL files found in bin directory"
          echo "Checking other locations..."
          dir build /s *.dll
        )
