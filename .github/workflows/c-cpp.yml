name: C/C++ CI Windows x86 DLL MSVC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install make for Windows
      run: |
        choco install make -y
        
    - name: Setup MSVC x86 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        
    - name: configure
      run: |
        ./configure --enable-shared
        
    - name: make
      run: make
        
    - name: make check
      run: make check
        
    - name: make distcheck
      run: make distcheck
        
    - name: List created files
      run: |
        dir /s
        if exist "*.dll" (
          echo "=== DLL Architecture Check ==="
          for /r %%i in (*.dll) do (
            echo File: %%i
            dumpbin /headers "%%i" | findstr "machine"
          )
        )
